[pytest]
# Don't collect direct-execution scripts as pytest tests.
# These files do setup/teardown and must be run with `py <file>` not `pytest`.
norecursedirs = .git .github __pycache__ dist runtime plan log .planning
addopts = --ignore=application/test/portal/test_customer_full.py --ignore=application/test/portal/test_update_e2e.py --ignore=application/test/portal/test_update_flow.py --ignore=application/test/portal/test_upgrade_playwright.py --ignore=application/test/all_in_one/test_e2e_playwright.py --ignore=application/test/all_in_one/test_template_editor_e2e.py --ignore=application/test/config_analyzer/test_e2e_playwright.py
