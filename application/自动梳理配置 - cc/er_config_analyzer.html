      }
      if (unlaneBGP.length) {
        warnings.push('以下 BGP 邻居未能判定主/备画布区（仅文字摘要中保留，不在拓扑上绘制该邻居节点）: ' + unlaneBGP.slice(0, 16).join(', '));
      }
      var unanchorBGP = [];
      for (bi = 0; bi < bgpBindings.length; bi++) {
        if (!(bgpBindings[bi].anchor_tunnel || '').trim()) unanchorBGP.push(bgpBindings[bi].neighbor);
      }
      if (unanchorBGP.length) {
        warnings.push('以下 BGP 邻居未能绑定到本机隧道接口（egress 非隧道名且无 neighbor/* 的 via_tunnel 证据），不在拓扑上绘制: ' + unanchorBGP.slice(0, 16).join(', '));
      }
      if (!defaultTargets.length) {
        warnings.push('未从配置中解析到默认路由（优先：community80 route-map next-hop；回退：static main 0/0）。因此拓扑上不会把 NAT outbound 误标成"默认路由"；如你确认存在默认路由，请检查是否使用了未覆盖的 VyOS 语法。');
      }

      // -- Summary lines --
      var summaryLines = [
        '- Tunnel 总数: ' + Object.keys(tunnels).length + ' (OpenVPN=' + openvpnCount + ', IPsec-VTI=' + ipsecVtiCount +
        ', 策略IPsec=' + ipsecPolicyCount + ', 国内GRE=' + greUpeCount + ', 海外GRE=' + greOverseasCount +
        ', 待判定=' + greUnknownCount + ')',
        '- 默认出口链路: ' + defaultTargets.length + ' 条',
        '- BGP 邻居: ' + bgpBindings.length + '，含 update-source 绑定: ' +
        bgpBindings.filter(function(x) { return x.update_source; }).length + '，含 export prefix-list: ' +
        bgpBindings.filter(function(x) { return x.export_prefix_list; }).length + '，已展开宣告前缀条目: ' +
        bgpBindings.reduce(function(s, x) { return s + x.advertised_prefixes.length; }, 0),
        '- 海外出口隧道: ' + (overseasTunnels.length ? overseasTunnels.join(', ') : '无（未发现 NATPE 海外出口隧道）')
      ];
      if (bgpBindings.length) {
        summaryLines.splice(3, 0, '- BGP 业务归类: ' + (bgpServiceType === 'fastip' ? 'ER FastIP(RSVR)' : 'GRE组网/非RSVR'));
      }
      if (dnatRuleCount) {
        var dnatPrefixesAll = [];
        var dpKeys = Object.keys(dnatRulePrefixes);
        for (var dpk = 0; dpk < dpKeys.length; dpk++) {
          for (var dpi = 0; dpi < dnatRulePrefixes[dpKeys[dpk]].length; dpi++) {
            dnatPrefixesAll.push(dnatRulePrefixes[dpKeys[dpk]][dpi]);
          }
        }
        dnatPrefixesAll.sort();
        if (dnatPrefixesAll.length > 4) {
          summaryLines.push('- DNAT 网段: ' + dnatPrefixesAll.length + ' 条（详见NAT梳理）');
        } else if (dnatPrefixesAll.length) {
          summaryLines.push('- DNAT 网段: ' + dnatPrefixesAll.join(','));
        } else {
          summaryLines.push('- DNAT 配置命中: ' + dnatRuleCount + ' 行（未提取到 destination address）');
        }
      }
      if (defaultRouteResolution) {
        var chx = defaultRouteResolution.nh_chain || [];
        var tunX = defaultRouteResolution.tunnel || '';
        var kdx = defaultRouteResolution.kind || '';
        if (chx.length) {
          summaryLines.push('- 默认路由递归: ' + kdx + ' | ' + chx.join(' -> ') + ' -> 隧道 ' + tunX);
        } else if (tunX) {
          summaryLines.push('- 默认路由: ' + kdx + ' -> 隧道 ' + tunX);
        }
      }

      // -- Mermaid graph --
      var graphNodes = [];
      var graphEdges = [];

      function addMNode(nodeId, label, nodeType) {
        if (!graphNodes.some(function(n) { return n.id === nodeId; })) {
          graphNodes.push({ id: nodeId, label: label, type: nodeType });
        }
      }
      function addMEdge(src, dst, label, edgeType) {
        graphEdges.push({ src: src, dst: dst, label: label, type: edgeType });
      }
      function safeID(s) { return String(s).replace(/[^a-zA-Z0-9_]/g, '_'); }

      addMNode('openvpn_core', '接入层(OpenVPN/IPsec-VTI/策略IPsec)', 'core');

      var sortedTunnels = Object.keys(tunnels).sort();
      for (var sti = 0; sti < sortedTunnels.length; sti++) {
        var node4 = tunnels[sortedTunnels[sti]];
        var nid = safeID(node4.name);
        var role4 = node4.inferred_role;
        var desc4 = (node4.description || '').trim();
        var nodeLbl = node4.name + ' [' + role4 + ']';
        if (desc4) nodeLbl += '\\n(' + desc4 + ')';
        addMNode(nid, nodeLbl, role4);
        if (ACCESS_TRANSPORT_ROLES.indexOf(role4) !== -1) {
          var lbl4 = role4 === 'ipsec-vti' ? 'vti' : (role4 === 'ipsec-policy' ? 'ipsec-s2s' : 'vtun');
          addMEdge('openvpn_core', nid, lbl4, 'link');
        }
      }

      // pe_docking edges
      var remoteToTunnel = {};
      for (tk = 0; tk < tnKeys.length; tk++) {
        var tn8 = tunnels[tnKeys[tk]];
        if (tn8.remote) remoteToTunnel[tn8.remote] = tn8.name;
      }
      for (ri = 0; ri < routes.length; ri++) {
        var r13 = routes[ri];
        var dstIP2 = r13.destination.split('/')[0];
        if (remoteToTunnel[dstIP2] && r13.via_tunnel) {
          var overseas = remoteToTunnel[dstIP2];
          addMEdge(safeID(r13.via_tunnel), safeID(overseas), 'pe_docking', 'link');
        }
      }

      // vtun_to_upe
      for (vtui = 0; vtui < vtunToUpe.length; vtui++) {
        addMEdge(safeID(vtunToUpe[vtui][0]), safeID(vtunToUpe[vtui][1]), 'vtun->upe', 'link');
      }

      // default targets
      for (var dti = 0; dti < defaultTargets.length; dti++) {
        var dt = defaultTargets[dti];
        var did = safeID('default_' + dt[0] + '_' + dt[1]);
        addMNode(did, 'Default:' + dt[0], 'default');
        addMEdge(did, safeID(dt[1]), '0.0.0.0/0', 'default');
      }

      // BGP nodes
      for (bi = 0; bi < bgpBindings.length; bi++) {
        var b7 = bgpBindings[bi];
        var pgTag = b7.peer_group || 'direct';
        var bid = safeID('bgp_' + pgTag + '_' + b7.neighbor);
        var advBrief = '';
        if (b7.advertised_prefixes.length) {
          advBrief = '\\nexport:' + b7.advertised_prefixes.slice(0, 4).join(',');
          if (b7.advertised_prefixes.length > 4) advBrief += '...';
        }
        var raTxt = b7.remote_as ? ' AS' + b7.remote_as : '';
        addMNode(bid, 'BGP' + raTxt + '\\n' + b7.neighbor + advBrief, 'bgp');
        var target = b7.egress_hint;
        if (target && tunnels[target]) {
          addMEdge(bid, safeID(target), 'update-source=' + (b7.update_source || '-'), 'bgp');
        } else {
          addMEdge(bid, 'openvpn_core', 'update-source=' + (b7.update_source || '-'), 'bgp');
        }
      }

      var mermaidLines = ['flowchart LR'];
      for (var gni = 0; gni < graphNodes.length; gni++) {
        mermaidLines.push(graphNodes[gni].id + '["' + graphNodes[gni].label + '"]');
      }
      for (var gei = 0; gei < graphEdges.length; gei++) {
        var e = graphEdges[gei];
        if (e.label) {
          mermaidLines.push(e.src + ' -->|"' + e.label + '"| ' + e.dst);
        } else {
          mermaidLines.push(e.src + ' --> ' + e.dst);
        }
      }

      // -- Parse Ledger --
      var notReadSample = [];
      for (var li2 = 0; li2 < rawLines.length; li2++) {
        if (lineConsumed[li2] === 'unparsed_set') notReadSample.push(rawLines[li2].trim());
      }

      var ledgerLines = ['=== 解析备注（证据与未覆盖项）==='];
      ledgerLines.push('\n--- 已解析（摘要） ---');
      ledgerLines.push('- [隧道与接口] n=' + Object.keys(tunnels).length + ' 含 interfaces tunnel/openvpn/vti 及推导对象');
      ledgerLines.push('- [路由] n=' + routes.filter(function(r) { return r.origin !== 'bgp-config'; }).length + ' static / table / 递归 via_tunnel');
      ledgerLines.push('- [BGP 邻居] n=' + bgpBindings.length + ' peer-group / update-source / route-map 等');
      ledgerLines.push('- [NAT source] n=' + Object.keys(natRuleOutbound).length + ' outbound-interface / translation / source');
      ledgerLines.push('- [策略路由 PBR] n=0 policy route + local-route');

      if (greReadPartial.length) {
        ledgerLines.push('\n--- 部分解析 ---');
        for (var gpi = 0; gpi < greReadPartial.length; gpi++) {
          ledgerLines.push('- [GRE source-address 弱命中] n=1 ' + greReadPartial[gpi]);
        }
      }

      var unresolvedList = [];
      for (tk = 0; tk < tnKeys.length; tk++) {
        var tn9 = tunnels[tnKeys[tk]];
        if (tn9.kind === 'tunnel' && tn9.inferred_role === 'gre-unknown') {
          unresolvedList.push('- [tunnel:' + tn9.name + '] n=1 角色未判定：无 route/NAT/source 强证据' +
            (acceptRemarkHeuristic ? '' : '；可勾选「接受备注启发」试用 description'));
        }
      }
      for (opk = 0; opk < opKeys.length; opk++) {
        if (!overseasParent[opKeys[opk]]) {
          unresolvedList.push('- [NATPE:' + opKeys[opk] + '] n=1 未解析上游父链路（无 source/路由证据）');
        }
      }
      if (unresolvedList.length) {
        ledgerLines.push('\n--- 未判定对象 ---');
        for (var uli = 0; uli < unresolvedList.length; uli++) { ledgerLines.push(unresolvedList[uli]); }
      }

      if (remarkConflicts.length) {
        ledgerLines.push('\n--- 备注与结构化结论冲突 ---');
        for (var rci = 0; rci < remarkConflicts.length; rci++) {
          var rc = remarkConflicts[rci];
          ledgerLines.push('- 隧道 ' + rc.tunnel + ': 备注暗示 [' + rc.remark_hint + '] vs 采用 [' + rc.resolved_role + '] 依据=' + rc.strong_basis);
          if (rc.reference) ledgerLines.push('  引用: ' + rc.reference.substring(0, 240));
        }
      }

      if (notReadSample.length) {
        ledgerLines.push('\n--- 未消费配置行（抽样） ---');
        ledgerLines.push('- [未解析的 set 行] n=' + notReadSample.length);
        var sample = notReadSample.slice(0, 20);
        for (var nsi = 0; nsi < sample.length; nsi++) { ledgerLines.push('  例: ' + sample[nsi]); }
      }

      if (!Object.keys(lineConsumed).length) {
        ledgerLines.push('\n--- 全部未消费 ---');
        ledgerLines.push('- 解析器未匹配到任何已知配置行');
      }

      // Chain diagnostics
      var chainDiag = ['\n=== 隧道链构建结果 ==='];
      for (tci = 0; tci < tcKeys.length; tci++) {
        var cidD = tcKeys[tci];
        chainDiag.push(cidD + ': ' + (tunnelChains[cidD] || []).join(','));
      }
      for (var cei = 0; cei < chainEdges.length; cei++) {
        chainDiag.push('edge ' + chainEdges[cei][0] + ' <-> ' + chainEdges[cei][1] + ' (' + chainEdges[cei][2] + ')');
      }
      for (var chi = 0; chi < chainRouteHints.length; chi++) {
        chainDiag.push('hint ' + chainRouteHints[chi][0] + ' -> ' + chainRouteHints[chi][1] + ' (' + chainRouteHints[chi][2] + ')');
      }
      var lineDiag = ['\n=== 主备判定（顺序2→3→4） ==='];
      for (tci = 0; tci < tcKeys.length; tci++) {
        var cidE = tcKeys[tci];
        lineDiag.push(cidE + ' -> ' + (chainSideMap[cidE] || 'unknown') + ' (' + (chainSideReason[cidE] || 'unknown') + ')');
      }
      var sortedTNames = Object.keys(tunnels).sort();
      for (var sti2 = 0; sti2 < sortedTNames.length; sti2++) {
        var tn10 = tunnels[sortedTNames[sti2]];
        if (ACCESS_TRANSPORT_ROLES.indexOf(tn10.inferred_role) === -1 && tn10.inferred_role !== 'gre-upe' && tn10.inferred_role !== 'gre-overseas') continue;
        var ls = lineSideMap[tn10.name] || 'unknown';
        var rs = lineSideReason[tn10.name] || 'unknown';
        lineDiag.push((tn10.name + '                 ').substring(0, 18) + ' -> ' + (ls + '       ').substring(0, 7) + ' (' + rs + ') role=' + tn10.inferred_role);
      }
      if (sideConflicts.length) {
        lineDiag.push('conflicts: ' + sideConflicts.slice(0, 32).join('; '));
      }
      var parseLedgerText = ledgerLines.join('\n') + '\n' + chainDiag.join('\n') + '\n' + lineDiag.join('\n');

      // -- IP Digest --
      var ipToIfaces2 = {};
      for (iak = 0; iak < iaKeys.length; iak++) {
        var iname2 = iaKeys[iak];
        var addrs3 = ifaceAddrBook[iname2];
        for (ai = 0; ai < addrs3.length; ai++) {
          var hip4 = hostIPFromPfxOrAddr(String(addrs3[ai]));
          if (!hip4) continue;
          if (!ipToIfaces2[hip4]) ipToIfaces2[hip4] = [];
          if (ipToIfaces2[hip4].indexOf(iname2) === -1) ipToIfaces2[hip4].push(iname2);
        }
      }
      var ifaceIPs2 = {};
      var i2iKeys = Object.keys(ipToIfaces2);
      for (var i2k = 0; i2k < i2iKeys.length; i2k++) { ifaceIPs2[i2iKeys[i2k]] = true; }

      var ipOcc = {};
      var sortedIPs = Object.keys(ifaceIPs2).sort();
      for (var sipi = 0; sipi < sortedIPs.length; sipi++) { ipOcc[sortedIPs[sipi]] = []; }

      var bgpUpdateSourceIPs = {};
      for (bi = 0; bi < bgpBindings.length; bi++) {
        var usB = (bgpBindings[bi].update_source || '').trim();
        if (usB) bgpUpdateSourceIPs[usB] = true;
      }

      var excludedDeclTags = {
        'interfaces.address': true, 'interfaces.tunnel_addr': true, 'interfaces.openvpn_local': true,
        'interfaces.vti_addr': true, 'interfaces.description': true, 'interfaces.tunnel_desc': true,
        'interfaces.vti_desc': true
      };

      var IP_PATTERN = /\b(?:\d{1,3}\.){3}\d{1,3}(?:\/\d{1,2})?\b/g;

      for (li2 = 0; li2 < rawLines.length; li2++) {
        var s2 = rawLines[li2].trim();
        if (!s2 || s2.charAt(0) === '#') continue;
        if (excludedDeclTags[lineConsumed[li2] || '']) continue;
        var tag = lineConsumed[li2] || '';
        var ipMatches = s2.match(IP_PATTERN);
        if (ipMatches) {
          for (var imi = 0; imi < ipMatches.length; imi++) {
            var ip0m = String(ipMatches[imi]).split('/')[0];
            if (ipOcc[ip0m]) {
              ipOcc[ip0m].push([li2 + 1, tag || 'unparsed', s2]);
            }
          }
        }
      }

      var ipDigestLines = ['=== IP梳理（不计算声明和备注的应用次数）===', ''];
      var rankedIPs = Object.keys(ipOcc).sort(function(a, b) { return ipOcc[b].length - ipOcc[a].length || a.localeCompare(b); });
      for (var rpi = 0; rpi < rankedIPs.length; rpi++) {
        var ipx = rankedIPs[rpi];
        var hits = ipOcc[ipx] || [];
        var ifaces2 = ipToIfaces2[ipx] || [];
        var ifn3 = ifaces2.length ? ifaces2[0] : 'unknown-iface';
        var descI = ifaceDescBook[ifn3] || '';
        descI = descI.trim() ? descI : '无';
        ipDigestLines.push('- ' + ifn3 + ' ' + ipx + ' | 引用 ' + hits.length + ' 次 | description: ' + descI);
        if (hits.length) {
          for (var hi = 0; hi < hits.length; hi++) {
            ipDigestLines.push('  . L' + hits[hi][0] + ' [' + hits[hi][1] + '] ' + hits[hi][2]);
          }
        } else {
          ipDigestLines.push('  . (无引用)');
        }
        ipDigestLines.push('');
      }
      var ipDigestText = ipDigestLines.join('\n');

      // -- Return result object (Task 6 assembly) --
      return {
        tunnels: tunnels,
        routes: routes,
        bgp: bgpBindings,
        graph_nodes: graphNodes,
        graph_edges: graphEdges,
        chain_side_map: chainSideMap,
        chain_side_reason: chainSideReason,
        line_side_map: lineSideMap,
        line_side_reason: lineSideReason,
        tunnel_chain_id_by_name: tunnelChainIDByName,
        tunnel_chains: tunnelChains,
        overseas_parent: overseasParent,
        vtun_to_upe: vtunToUpe,
        bgp_service_type: bgpServiceType,
        default_targets: defaultTargets,
        default_route_resolution: defaultRouteResolution,
        outbound_sources: outboundSources,
        outbound_rule_info: outboundRuleInfo,
        warnings: warnings,
        hostname: hostname,
        mermaid: mermaidLines.join('\n'),
        summary: summaryLines.join('\n'),
        parse_ledger_text: parseLedgerText,
        parse_ledger: { remark_conflicts: remarkConflicts },
        remark_conflicts: remarkConflicts,
        ip_digest_text: ipDigestText,
        line_consumed_count: Object.keys(lineConsumed).length
      };
    }
  };

  // ============================================================
  // SVG Topology Canvas Rendering (Task 7)
  // ============================================================
  window.TopoCanvas = (function() {
    'use strict';

    var SVG_NS = 'http://www.w3.org/2000/svg';
    var ZOOM = 1.0;
    var PAN_X = 0, PAN_Y = 0;
    var IS_PANNING = false;
    var LAST_MOUSE_X = 0, LAST_MOUSE_Y = 0;

    // ── Dynamic layout constants ────────────────────────────────
    var NODE_W      = 200;    // wider for better readability
    var NODE_H      = 52;     // taller for 2-line text
    var COL_GAP_X   = 36;     // horizontal gap between columns
    var ROW_GAP_Y   = 20;     // vertical gap between nodes in same lane
    var LANE_GAP_Y  = 64;     // gap between lanes
    var HOST_W      = 80;     // host oval width
    var HOST_H      = 48;     // host oval height
    var LEFT_PAD    = 80;     // left margin
    var TOP_PAD2    = 40;     // top margin
    var FONT_SZ     = 13;     // base font size (from 10-11px)
    var FONT_SZ_SM  = 11;     // small font size
    var NOTE_MAX_W  = 320;    // max width for SNAT note text

    var ACCESS_TRANSPORT_ROLES = ['openvpn', 'ipsec-vti', 'ipsec-policy'];

    function F(v) { return v * ZOOM; }

    // FIX #6: bound clamping
    function clampY(y, top, bot, h) {
      return Math.max(top, Math.min(bot - h, y));
    }

    // ── SVG builders ─────────────────────────────────────────────
    function elt(tag, attrs) {
      var e = document.createElementNS(SVG_NS, tag);
      for (var k in attrs) {
        if (!attrs.hasOwnProperty(k)) continue;
        if (k === 'text') e.textContent = attrs[k];
        else if (k === 'html') e.innerHTML = attrs[k];
        else e.setAttribute(k, attrs[k]);
      }
      return e;
    }

    function mtext(x, y, str, opts) {
      opts = opts || {};
      var a = {
        x: x, y: y,
        'font-family': opts.font || '"JetBrains Mono","Fira Code",monospace',
        'font-size': F(opts.size || FONT_SZ),
        fill: opts.fill || '#26251e'
      };
      if (opts.anchor) a['text-anchor'] = opts.anchor;
      if (opts.bold) a['font-weight'] = '600';
      var te = elt('text', a);
      var lines = str.split('\n');
      te.textContent = lines[0] || '';
      var lh = F(opts.lineH || Math.round((opts.size || FONT_SZ) * 1.35));
      for (var i = 1; i < lines.length; i++) {
        var tsp = elt('tspan', {
          x: x, dy: lh,
          'font-size': F(opts.size2 || opts.size || FONT_SZ),
          fill: opts.fill2 || opts.fill || '#5a5852'
        });
        tsp.textContent = lines[i];
        te.appendChild(tsp);
      }
      return te;
    }

    function nodeRect(x, y, w, h, fill, stroke) {
      return elt('rect', { x: x, y: y, width: w, height: h, rx: F(4), fill: fill, stroke: stroke || '#111827', 'stroke-width': F(1) + '' });
    }

    function arrowLine(x1, y1, x2, y2, color, dash) {
      color = color || '#111827';
      var mid = color === '#2563eb' ? 'ah-blue' : (color === '#0e7490' ? 'ah-cyan' : 'ah-black');
      var ln = elt('line', { x1: x1, y1: y1, x2: x2, y2: y2, stroke: color, 'stroke-width': Math.max(1, Math.round(F(1.5))) + '', 'marker-end': 'url(#' + mid + ')' });
      if (dash) ln.setAttribute('stroke-dasharray', dash);
      return ln;
    }

    // ── Labels ───────────────────────────────────────────────────
    function tunnelLabel(tn) {
      var desc = (tn.description || '').trim();
      if (desc) return tn.name + '\n(' + desc + ')';
      return tn.name;
    }

    function roleTag(role, kind) {
      if (role === 'openvpn')       return 'OpenVPN';
      if (role === 'ipsec-vti')     return 'IPsec-VTI';
      if (role === 'ipsec-policy')  return '策略IPsec';
      if (role === 'gre-upe')       return 'GRE-UPE';
      if (role === 'gre-overseas')  return 'GRE-Overseas';
      return (kind || role || 'unknown').substring(0, 12);
    }

    // ── Main draw ────────────────────────────────────────────────
    function draw(topology) {
      var svg = document.getElementById('topoSvg');
      if (!svg) return;
      while (svg.firstChild) svg.removeChild(svg.firstChild);

      if (!topology || !topology.tunnels) return;

      // Extract data
      var tunnels = topology.tunnels || {};
      var lineSideMap = topology.line_side_map || {};
      var overseasParent = topology.overseas_parent || {};
      var vtunToUpe = topology.vtun_to_upe || [];
      var bgpList = topology.bgp || [];
      var defaultTargets = topology.default_targets || [];
      var outboundSources = topology.outbound_sources || {};
      var outboundRuleInfo = topology.outbound_rule_info || {};
      var hostname = topology.hostname || '本机';
      var routes = topology.routes || [];

      var tunnelNodes = [];
      var tunnelByName = {};
      var tnKeys = Object.keys(tunnels);
      for (var ti = 0; ti < tnKeys.length; ti++) {
        var tn = tunnels[tnKeys[ti]];
        if (!tn || !tn.name) continue;
        tunnelNodes.push(tn);
        tunnelByName[tn.name] = tn;
      }

      function lineSide(tn) {
        var v = lineSideMap[tn.name];
        return (v === 'main' || v === 'backup') ? v : 'unknown';
      }

      // Partition by role + side
      var accessBySide = { main: [], backup: [], unknown: [] };
      var upeBySide    = { main: [], backup: [], unknown: [] };
      var outBySide    = { main: [], backup: [], unknown: [] };
      for (var ai = 0; ai < tunnelNodes.length; ai++) {
        var t = tunnelNodes[ai];
        var role = t.inferred_role || 'unknown';
        var side = lineSide(t);
        if (ACCESS_TRANSPORT_ROLES.indexOf(role) !== -1) accessBySide[side].push(t);
        else if (role === 'gre-upe') upeBySide[side].push(t);
        else if (role === 'gre-overseas') outBySide[side].push(t);
      }

      // Only render lanes that actually have content
      var activeSides = [];
      ['main', 'backup', 'unknown'].forEach(function(s) {
        if (accessBySide[s].length || upeBySide[s].length || outBySide[s].length) activeSides.push(s);
      });
      if (!activeSides.length) activeSides = ['main', 'backup', 'unknown'];

      // Compute underlay order per lane
      var underlayOrders = {};
      var maxUnderlay = 1;
      activeSides.forEach(function(s) {
        var ul = [];
        var acc = accessBySide[s] || [];
        for (var i = 0; i < acc.length; i++) { ul.push(acc[i].name); }
        underlayOrders[s] = ul;
        if (ul.length > maxUnderlay) maxUnderlay = ul.length;
      });
      maxUnderlay = Math.max(1, maxUnderlay);

      // ── Compute dynamic column positions ──────────────────────
      var nw = F(NODE_W), nh = F(NODE_H), cgx = F(COL_GAP_X), rgy = F(ROW_GAP_Y);
      var hostW2 = Math.max(F(HOST_W), F(28 + String(hostname || '').length * 8));
      var hostH2 = F(HOST_H);

      // X columns — compute dynamically from max underlay count
      var xHost    = F(LEFT_PAD);
      var xChain0  = xHost + hostW2 + cgx;
      var slotW    = nw + cgx;
      var xUPE0    = xChain0 + maxUnderlay * slotW + cgx;
      var xOut0    = xUPE0 + nw + cgx * 2;

      // Compute total overseas columns needed
      var maxOverseasInLane = 0;
      activeSides.forEach(function(s) { maxOverseasInLane = Math.max(maxOverseasInLane, (outBySide[s] || []).length); });

      // ── Compute lane heights dynamically ───────────────────────
      var laneInfo = {};  // { side: { baseY, height, top, bottom } }
      var curY = F(TOP_PAD2);

      activeSides.forEach(function(side) {
        var underlays = underlayOrders[side] || [];
        var ulCount = underlays.length;
        var overseasCount = (outBySide[side] || []).length;
        var hasUPE = !!(upeBySide[side] && upeBySide[side].length);
        var bgpInLane = 0;
        for (var bi = 0; bi < bgpList.length; bi++) {
          var at = (bgpList[bi].anchor_tunnel || '').trim();
          if (at && (lineSideMap[at] || 'unknown') === side) bgpInLane++;
        }
        bgpInLane = Math.min(bgpInLane, 8);

        // Compute height needed for this lane
        var maxRow = Math.max(ulCount, overseasCount, 1);
        var bodyH = maxRow * (nh + rgy) + rgy;
        // Add BGP section height
        if (bgpInLane > 0) bodyH += bgpInLane * F(42);

        laneInfo[side] = {
          baseY: curY,
          height: bodyH,
          top: curY,
          bottom: curY + bodyH
        };
        curY += bodyH + F(LANE_GAP_Y);
      });

      // Host Y = center between first lane top and last lane bottom
      var hostY = Math.round((laneInfo[activeSides[0]].top + laneInfo[activeSides[activeSides.length - 1]].bottom) / 2);
      var totalW = xOut0 + maxOverseasInLane * (nw + cgx) + F(NOTE_MAX_W) + F(40);
      var totalH = curY + F(40);

      // ── SVG setup ──────────────────────────────────────────────
      var g = elt('g', {});

      var defs = elt('defs', {});
      var markers = [
        { id: 'ah-black', color: '#111827' },
        { id: 'ah-blue',  color: '#2563eb' },
        { id: 'ah-cyan',  color: '#0e7490' }
      ];
      for (var mi = 0; mi < markers.length; mi++) {
        var mk = elt('marker', { id: markers[mi].id, markerWidth: '8', markerHeight: '6', refX: '7', refY: '3', orient: 'auto' });
        mk.innerHTML = '<polygon points="0 0, 8 3, 0 6" fill="' + markers[mi].color + '"/>';
        defs.appendChild(mk);
      }
      g.appendChild(defs);

      var usedBoxes = []; // for overlap detection: [x, y, w, h]

      function rectsOverlap(a, b) {
        return !(a[0] + a[2] <= b[0] || b[0] + b[2] <= a[0] || a[1] + a[3] <= b[1] || b[1] + b[3] <= a[1]);
      }
      function checkOverlap(x, y, w, h) {
        var b = [x, y, w, h];
        for (var i = 0; i < usedBoxes.length; i++) {
          if (rectsOverlap(b, usedBoxes[i])) return true;
        }
        usedBoxes.push(b);
        return false;
      }

      // ── Lane backgrounds ───────────────────────────────────────
      var laneLabels = { main: '主线', backup: '备线', unknown: '未知线路' };
      activeSides.forEach(function(side) {
        var li = laneInfo[side];
        g.appendChild(elt('rect', {
          x: F(10), y: li.top, width: totalW - F(20), height: li.height,
          fill: '#f9fafb', rx: F(4), 'fill-opacity': '0.5'
        }));
        g.appendChild(mtext(F(20), li.top + F(20), laneLabels[side] || side, { anchor: 'start', bold: true, fill: '#26251e', size: FONT_SZ_SM + 1 }));
      });

      // ── Host oval ──────────────────────────────────────────────
      var hostCX = xHost + hostW2 / 2;
      var hostCY = hostY;
      var hostRX = hostW2 / 2, hostRY = hostH2 / 2;
      g.appendChild(elt('ellipse', { cx: hostCX, cy: hostCY, rx: hostRX, ry: hostRY, fill: '#26251e', stroke: '#26251e', 'stroke-width': '1' }));
      g.appendChild(mtext(hostCX, hostCY, hostname, { anchor: 'middle', fill: '#ffffff', size: FONT_SZ_SM + 1, bold: true }));
      checkOverlap(xHost, hostCY - hostRY, hostW2, hostH2);
      var hostEdgeR = xHost + hostW2;

      // Position trackers
      var upeYByName = {};
      var vtYByName  = {};
      var vtXByName  = {};
      var outYByName = {};
      var outXByName = {};
      var tunnelUIBox  = {};
      var bgpAnchorBox = {};

      // Default route
      var defaultIface = '';
      var dr = topology.default_route_resolution || {};
      if (typeof dr === 'object' && dr.tunnel) defaultIface = String(dr.tunnel).trim();
      if (!defaultIface && defaultTargets && defaultTargets.length) defaultIface = String(defaultTargets[0][1] || '').trim();

      function drawDefaultBadge(bx, by) {
        var bw = F(72), bh = F(20);
        g.appendChild(elt('rect', { x: bx + nw - bw, y: by - bh + F(2), width: bw + F(4), height: bh, fill: '#fef3c7', stroke: '#b45309', 'stroke-width': F(0.8) + '', rx: F(3) }));
        g.appendChild(mtext(bx + nw - bw / 2, by - bh / 2 + F(2), 'default', { anchor: 'middle', size: FONT_SZ_SM, bold: true, fill: '#b45309' }));
      }

      // Track-fallback info
      var outTrackFallbackParents = {};
      var deferredTrackFallbackEdges = [];
      for (var otfi = 0; otfi < tunnelNodes.length; otfi++) {
        var ot = tunnelNodes[otfi];
        if (ot.inferred_role !== 'gre-overseas' || !(ot.remote || '').trim()) continue;
        var rmt = (ot.remote || '').trim();
        if (!rmt) continue;
        var primaryParent = overseasParent[ot.name] || '';
        if (!primaryParent || !tunnelByName[primaryParent]) continue;
        var primarySide = lineSide(tunnelByName[primaryParent]);
        if (primarySide !== 'main' && primarySide !== 'backup') continue;
        var dstRemote32 = rmt + '/32';
        var matchedRoutes = [];
        for (var mri = 0; mri < routes.length; mri++) {
          if (routes[mri].destination === dstRemote32 && routes[mri].via_tunnel) matchedRoutes.push(routes[mri]);
        }
        if (!matchedRoutes.length) continue;
        var hasTrack = matchedRoutes.some(function(mr) { return !!mr.track_name; });
        if (!hasTrack) continue;
        for (var mri3 = 0; mri3 < matchedRoutes.length; mri3++) {
          var mr2 = matchedRoutes[mri3];
          var via = mr2.via_tunnel.trim();
          var trn = mr2.track_name.trim() || 'failover';
          if (via === primaryParent || !tunnelByName[via]) continue;
          var viaSide = lineSide(tunnelByName[via]);
          if (viaSide === primarySide || (viaSide !== 'main' && viaSide !== 'backup')) continue;
          if (!outTrackFallbackParents[ot.name]) outTrackFallbackParents[ot.name] = [];
          outTrackFallbackParents[ot.name].push([via, trn]);
        }
      }

      // ── DRAW EACH LANE ────────────────────────────────────────
      activeSides.forEach(function(side) {
        var li = laneInfo[side];
        var baseY = li.top;
        var underlays = underlayOrders[side] || [];
        var upeList = upeBySide[side] || [];
        var overseasList = outBySide[side] || [];

        // UPE X
        var xUpeLane = xUPE0;

        // ── Access transport nodes ─────────────────────────────
        for (var ui = 0; ui < underlays.length; ui++) {
          var uname = underlays[ui];
          var tn2 = tunnelByName[uname];
          if (!tn2) continue;
          var xu = xChain0 + ui * slotW;
          var role2 = tn2.inferred_role || '';
          vtYByName[uname] = baseY;
          vtXByName[uname] = xu;

          if (role2 === 'local-iface') continue;

          var fill, stroke;
          if (role2 === 'openvpn')           { fill = '#dbeafe'; stroke = '#93c5fd'; }
          else if (role2 === 'ipsec-policy') { fill = '#ddd6fe'; stroke = '#c4b5fd'; }
          else if (role2 === 'ipsec-vti')    { fill = '#e0e7ff'; stroke = '#c7d2fe'; }
          else                               { fill = '#e5e7eb'; stroke = '#d1d5db'; }

          g.appendChild(nodeRect(xu, baseY, nw, nh, fill, stroke));
          g.appendChild(mtext(xu + nw / 2, baseY + F(16), tunnelLabel(tn2) + '\n' + roleTag(role2, tn2.kind), { anchor: 'middle', size: FONT_SZ_SM, size2: FONT_SZ_SM - 1 }));
          checkOverlap(xu, baseY, nw, nh);

          tunnelUIBox[uname] = [xu, baseY, nw, nh];
          bgpAnchorBox[uname + '|' + side] = [xu, baseY, nw, nh];
          if (defaultIface && uname === defaultIface) drawDefaultBadge(xu, baseY);
        }

        // Host → access arrows
        for (var ui2 = 0; ui2 < underlays.length; ui2++) {
          var aname2 = underlays[ui2];
          var atn2 = tunnelByName[aname2];
          if (!atn2 || atn2.inferred_role === 'local-iface') continue;
          var ax = vtXByName[aname2];
          if (ax == null) continue;
          g.appendChild(arrowLine(hostEdgeR, hostCY, ax + F(10), baseY + nh / 2));
        }

        // ── UPE ─────────────────────────────────────────────────
        var upe = upeList[0];
        if (!upe) {
          // Try to find UPE via vtun_to_upe
          var vtFirst = accessBySide[side][0];
          if (vtFirst) {
            for (var vpi = 0; vpi < vtunToUpe.length; vpi++) {
              var pair = vtunToUpe[vpi];
              if (!pair || pair.length < 2) continue;
              if (pair[0] === vtFirst.name) {
                var cand = tunnelByName[pair[1]];
                if (cand && cand.inferred_role === 'gre-upe' && lineSide(cand) === side) { upe = cand; break; }
              }
            }
          }
        }
        if (upe) {
          // Check overlap — if UPE X would overlap with rightmost access, push it
          var upeX = xUpeLane;
          var lastAccessRight = xChain0 + underlays.length * slotW;
          if (upeX < lastAccessRight + F(20)) upeX = lastAccessRight + F(20);
          xUpeLane = upeX;

          g.appendChild(nodeRect(upeX, baseY, nw, nh, '#dcfce7', '#86efac'));
          g.appendChild(mtext(upeX + nw / 2, baseY + F(16), tunnelLabel(upe) + '\n' + roleTag(upe.inferred_role, upe.kind), { anchor: 'middle', size: FONT_SZ_SM, size2: FONT_SZ_SM - 1 }));
          checkOverlap(upeX, baseY, nw, nh);

          upeYByName[upe.name] = baseY;
          tunnelUIBox[upe.name] = [upeX, baseY, nw, nh];
          bgpAnchorBox[upe.name + '|' + side] = [upeX, baseY, nw, nh];
          if (defaultIface && upe.name === defaultIface) drawDefaultBadge(upeX, baseY);

          // Arrow from rightmost access to UPE
          var lastAX = xChain0;
          for (var ui3 = underlays.length - 1; ui3 >= 0; ui3--) {
            var una3 = underlays[ui3];
            var unt3 = tunnelByName[una3];
            if (unt3 && ACCESS_TRANSPORT_ROLES.indexOf(unt3.inferred_role || '') !== -1 && vtXByName[una3] != null) {
              lastAX = vtXByName[una3] + nw;
              break;
            }
          }
          g.appendChild(arrowLine(lastAX, baseY + nh / 2, upeX, baseY + nh / 2));

          // Update xOut0 to be after UPE
          var upeRight = upeX + nw + cgx * 2;
          if (upeRight > xOut0) xOut0 = upeRight;
        }

        // ── Overseas nodes ──────────────────────────────────────
        if (overseasList.length) {
          var overseasColX = Math.max(xOut0, xUpeLane + nw + cgx * 3);
          var maxOutPerCol = Math.max(1, Math.floor((li.height - F(20)) / (nh + rgy)));
          var outNoteOffsetX = nw + F(16);

          for (var oi = 0; oi < overseasList.length; oi++) {
            var out = overseasList[oi];
            var colIdx = Math.floor(oi / maxOutPerCol);
            var rowIdx = oi % maxOutPerCol;
            var ox = overseasColX + colIdx * (nw + F(NOTE_MAX_W) + cgx);
            var oy = clampY(baseY + rowIdx * (nh + rgy), li.top, li.bottom, nh);

            g.appendChild(nodeRect(ox, oy, nw, nh, '#fee2e2', '#fca5a5'));
            g.appendChild(mtext(ox + nw / 2, oy + F(16), tunnelLabel(out) + '\n' + roleTag(out.inferred_role, out.kind), { anchor: 'middle', size: FONT_SZ_SM, size2: FONT_SZ_SM - 1 }));
            checkOverlap(ox, oy, nw, nh);

            outYByName[out.name] = oy;
            outXByName[out.name] = ox;
            tunnelUIBox[out.name] = [ox, oy, nw, nh];
            bgpAnchorBox[out.name + '|' + side] = [ox, oy, nw, nh];

            // Parent → overseas arrow
            var parent = overseasParent[out.name] || '';
            var yDst = oy + nh / 2;
            if (parent && upeYByName[parent] != null) {
              var pbox = tunnelUIBox[parent];
              g.appendChild(arrowLine(pbox[0] + pbox[2], pbox[1] + pbox[3] / 2, ox, yDst));
            } else if (parent && vtYByName[parent] != null) {
              var vbox = tunnelUIBox[parent];
              g.appendChild(arrowLine(vbox[0] + vbox[2], vbox[1] + vbox[3] / 2, ox, yDst));
            } else if (parent === 'host') {
              g.appendChild(arrowLine(hostEdgeR + F(4), hostCY, ox, yDst));
            }

            // Track-fallback deferred
            var fbList = outTrackFallbackParents[out.name] || [];
            for (var fbi = 0; fbi < fbList.length; fbi++) {
              deferredTrackFallbackEdges.push([fbList[fbi][0], out.name, fbList[fbi][1]]);
            }

            // Default route badge
            var isDefault = (defaultIface && out.name === defaultIface);
            if (!isDefault && defaultTargets && defaultTargets.length) {
              for (var dti = 0; dti < defaultTargets.length; dti++) {
                if (defaultTargets[dti][1] === out.name) { isDefault = true; break; }
              }
            }
            if (isDefault) drawDefaultBadge(ox, oy);

            // SNAT note — with overlap-aware placement
            var srcs = outboundSources[out.name] || [];
            var rules = outboundRuleInfo[out.name] || [];
            var srcText = '';
            if (rules && rules.length) {
              var uniqSrc = [];
              for (var sri = 0; sri < srcs.length; sri++) {
                if (uniqSrc.indexOf(srcs[sri]) === -1) uniqSrc.push(srcs[sri]);
              }
              uniqSrc.sort();
              srcText = uniqSrc.length > 4
                ? 'SNAT ' + uniqSrc.length + '条'
                : (uniqSrc.length ? uniqSrc.join(',') : '(未识别)');
            } else if (srcs && srcs.length) {
              srcText = srcs.length > 4 ? 'SNAT ' + srcs.length + '条' : srcs.join(',');
            } else {
              srcText = '(未识别)';
            }
            var noteX = ox + outNoteOffsetX;
            // Check if note would overlap with next overseas node
            var noteW = Math.min(srcText.length * F(FONT_SZ_SM * 0.7), F(NOTE_MAX_W));
            if (!checkOverlap(noteX, oy, noteW, nh)) {
              g.appendChild(mtext(noteX, oy + F(16), srcText, { anchor: 'start', size: FONT_SZ_SM - 1, fill: '#4b5563', font: '"Inter",system-ui,sans-serif' }));
            }
          }
        }
      });

      // ── Deferred track-fallback edges ──────────────────────────
      for (var dfei = 0; dfei < deferredTrackFallbackEdges.length; dfei++) {
        var df = deferredTrackFallbackEdges[dfei];
        var fbParent = df[0], outName = df[1], fbTrack = df[2];
        var pb = tunnelUIBox[fbParent];
        var ob = tunnelUIBox[outName];
        if (!pb || !ob) continue;
        g.appendChild(arrowLine(pb[0] + pb[2], pb[1] + pb[3] / 2, ob[0], ob[1] + ob[3] / 2, '#2563eb', '4,4'));
        if (fbTrack) {
          g.appendChild(mtext(Math.round((pb[0] + pb[2] + ob[0]) / 2), Math.round((pb[1] + pb[3] / 2 + ob[1] + ob[3] / 2) / 2) - F(6), 'track:' + fbTrack, { anchor: 'middle', size: FONT_SZ_SM - 1, fill: '#1d4ed8' }));
        }
      }

      // ── BGP bindings ───────────────────────────────────────────
      if (bgpList && bgpList.length) {
        var byKey = {};
        for (var bi = 0; bi < bgpList.length; bi++) {
          var b = bgpList[bi];
          var at = (b.anchor_tunnel || '').trim();
          if (!at) continue;
          var ln = lineSideMap[at] || 'unknown';
          if (ln !== 'main' && ln !== 'backup' && ln !== 'unknown') ln = 'unknown';
          var key = at + '|' + ln;
          if (!byKey[key]) byKey[key] = [];
          byKey[key].push(b);
        }

        var byKeys = Object.keys(byKey);
        for (var bki = 0; bki < byKeys.length; bki++) {
          var key2 = byKeys[bki];
          var band = byKey[key2].slice(0, 8);
          var box2 = bgpAnchorBox[key2];
          if (!box2) continue;

          var bx = box2[0], by2 = box2[1], bw2 = box2[2], bh2 = box2[3];
          var bgpRX = F(28), bgpRY = F(18);
          var cy = by2 + bh2 + F(12);
          var cx = bx + bw2 / 2;

          for (var bj = 0; bj < band.length; bj++) {
            var bgp = band[bj];
            // Check BGP doesn't overlap with anything important
            var bgpY = cy + bgpRY;
            checkOverlap(cx - bgpRX, bgpY - bgpRY, bgpRX * 2, bgpRY * 2 + F(44));

            // BGP oval
            g.appendChild(elt('ellipse', { cx: cx, cy: bgpY, rx: bgpRX, ry: bgpRY, fill: '#cffafe', stroke: '#0e7490', 'stroke-width': F(0.8) + '' }));
            g.appendChild(mtext(cx, bgpY, 'BGP', { anchor: 'middle', size: FONT_SZ_SM - 1, bold: true, fill: '#0c4a6e' }));

            // Neighbor label
            var nbrLabelY = bgpY + bgpRY + F(8);
            g.appendChild(mtext(cx, nbrLabelY, bgp.neighbor, { anchor: 'middle', size: FONT_SZ_SM - 1, bold: true, fill: '#26251e' }));

            // Dashed polyline to anchor
            var hint0 = (bgp.anchor_tunnel || bgp.egress_hint || '').trim();
            var tgtX = null, tgtY = null;
            if (hint0 && vtYByName[hint0] != null) {
              tgtX = (vtXByName[hint0] || xChain0) + nw / 2;
              tgtY = vtYByName[hint0] + nh / 2;
            } else if (hint0 && upeYByName[hint0] != null) {
              tgtX = xUPE0 + nw / 2;
              tgtY = upeYByName[hint0] + nh / 2;
            } else if (hint0 && outYByName[hint0] != null) {
              tgtX = outXByName[hint0] + nw / 2;
              tgtY = outYByName[hint0] + nh / 2;
            }
            if (tgtX != null) {
              var midX = Math.max(cx, tgtX) + F(20);
              g.appendChild(elt('polyline', {
                points: cx + ',' + (nbrLabelY + F(6)) + ' ' + midX + ',' + (nbrLabelY + F(6)) + ' ' + midX + ',' + tgtY + ' ' + tgtX + ',' + tgtY,
                fill: 'none', stroke: '#0e7490', 'stroke-width': F(0.8) + '', 'stroke-dasharray': '4,4',
                'marker-end': 'url(#ah-cyan)'
              }));
            }
            cy = nbrLabelY + F(32);
          }
        }
      }

      // ── Default route label on host→default-vtun ──────────────
      var defaultVtun = '';
      if (defaultTargets && defaultTargets.length) {
        var dtun = String(defaultTargets[0][1] || '');
        var dnode = tunnelByName[dtun];
        if (dnode && ACCESS_TRANSPORT_ROLES.indexOf(dnode.inferred_role || '') !== -1) defaultVtun = dtun;
      }
      if (defaultVtun && vtXByName[defaultVtun] != null) {
        var dvx = vtXByName[defaultVtun];
        var dlSide = lineSideMap[defaultVtun] || 'unknown';
        var dli = laneInfo[dlSide];
        var dlBaseY = dli ? dli.top : laneInfo[activeSides[0]].top;
        var dlYMid = dlBaseY + nh / 2;
        var my2 = hostCY + 0.55 * (dlYMid - hostCY) - F(18);
        g.appendChild(mtext(hostEdgeR + 0.55 * (dvx + F(10) - hostEdgeR), my2, 'default', { anchor: 'middle', size: FONT_SZ_SM, bold: true, fill: '#b45309' }));
      }

      // ── Final viewBox (auto-fit) ───────────────────────────────
      svg.appendChild(g);
      svg.setAttribute('viewBox', '0 0 ' + (totalW / ZOOM) + ' ' + (totalH / ZOOM));
      svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      applyPanTransform();
    }

    function applyPanTransform() {
      var svg = document.getElementById('topoSvg');
      if (!svg) return;
      var g = svg.firstElementChild;
      if (!g) return;
      g.setAttribute('transform', 'translate(' + PAN_X + ',' + PAN_Y + ')');
    }

    function updateZoomLabel() {
      var lbl = document.getElementById('zoomLabel');
      if (lbl) lbl.textContent = Math.round(ZOOM * 100) + '%';
    }

    // ── Public API ────────────────────────────────────────────
    return {
      draw: draw,

      getZoom: function() { return ZOOM; },
      setZoom: function(z) { ZOOM = Math.max(0.4, Math.min(2.5, z)); return ZOOM; },

      getPanX: function() { return PAN_X; },
      setPanX: function(x) { PAN_X = x; },
      getPanY: function() { return PAN_Y; },
      setPanY: function(y) { PAN_Y = y; },

      applyPanTransform: applyPanTransform,
      updateZoomLabel: updateZoomLabel,

      startPan: function(cx, cy) {
        IS_PANNING = true;
        LAST_MOUSE_X = cx;
        LAST_MOUSE_Y = cy;
      },
      movePan: function(cx, cy) {
        if (!IS_PANNING) return;
        var svg = document.getElementById('topoSvg');
        if (!svg) return;
        var vb = svg.getAttribute('viewBox');
        if (!vb) return;
        var vbParts = vb.split(' ');
        var vbW = parseFloat(vbParts[2]) || 1600;
        var scale = vbW / svg.clientWidth;
        PAN_X -= (cx - LAST_MOUSE_X) * scale;
        PAN_Y -= (cy - LAST_MOUSE_Y) * scale;
        LAST_MOUSE_X = cx;
        LAST_MOUSE_Y = cy;
        applyPanTransform();
      },
      endPan: function() {
        IS_PANNING = false;
      }
    };
  })();

  // ============================================================
  // UI Functions (Task 6 Part F)
  // ============================================================
  function escHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderNATTable(rows) {
    var tbody = document.querySelector('#natTable tbody');
    if (!rows || !rows.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:40px;">暂无数据。请粘贴配置后点击"解析并梳理"。</td></tr>';
      return;
    }
    var html = '';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      html += '<tr>';
      html += '<td>' + escHtml(r.rule) + '</td>';
      html += '<td>' + escHtml(r.source_ip) + '</td>';
      html += '<td>' + escHtml(r.egress_name) + '</td>';
      html += '<td>' + escHtml(r.egress_remark) + '</td>';
      html += '<td>' + escHtml(r.fake_ip) + '</td>';
      html += '<td>' + escHtml(r.real_ip) + '</td>';
      html += '</tr>';
    }
    tbody.innerHTML = html;
  }

  function switchResultTab(name) {
    var panels = {
      'nat': document.getElementById('natPanel'),
      'topology': document.getElementById('topologyPanel'),
      'ledger': document.getElementById('ledgerPanel'),
      'ipdigest': document.getElementById('ipDigestPanel')
    };
    var tabs = {
      'nat': document.getElementById('tabNat'),
      'topology': document.getElementById('tabTopology'),
      'ledger': document.getElementById('tabLedger'),
      'ipdigest': document.getElementById('tabIpDigest')
    };

    var panelKeys = Object.keys(panels);
    for (var i = 0; i < panelKeys.length; i++) {
      var key = panelKeys[i];
      if (key === name) {
        panels[key].removeAttribute('hidden');
        tabs[key].classList.add('active');
        tabs[key].setAttribute('aria-selected', 'true');
      } else {
        panels[key].setAttribute('hidden', '');
        tabs[key].classList.remove('active');
        tabs[key].setAttribute('aria-selected', 'false');
      }
    }
  }

  // ============================================================
  // Event Wiring
  // ============================================================
  document.addEventListener('DOMContentLoaded', function() {
    // Scene tabs
    var sceneTabs = document.querySelectorAll('.scene-tab');
    for (var i = 0; i < sceneTabs.length; i++) {
      sceneTabs[i].addEventListener('click', function() {
        var scene = this.getAttribute('data-scene');
        state.currentScene = scene;
        document.querySelectorAll('.scene-tab').forEach(function(t) { t.classList.remove('active'); });
        this.classList.add('active');
      });
    }

    // Result tabs
    var resultTabs = document.querySelectorAll('.result-tab');
    for (var j = 0; j < resultTabs.length; j++) {
      resultTabs[j].addEventListener('click', function() {
        var result = this.getAttribute('data-result');
        switchResultTab(result);
      });
    }

    // Analyze button
    document.getElementById('btnAnalyze').addEventListener('click', function() {
      var scene = document.querySelector('.scene-tab.active').getAttribute('data-scene');
      var configText = document.getElementById('configText').value;
      var mappingText = document.getElementById('mappingText').value;
      var acceptRemark = document.getElementById('acceptRemark').checked;

      if (scene === 'er') {
        state.rows = window.Analyzer.buildOutputRows(configText, mappingText);
        try {
          state.topology = window.Topology.analyze(configText, acceptRemark);
        } catch(e) {
          console.error('Topology analysis failed:', e);
          state.topology = null;
        }
      } else {
        state.rows = window.Analyzer.buildOutputRowsUSG(configText, mappingText);
        state.topology = null;
      }

      renderNATTable(state.rows);
      if (state.topology) {
        document.getElementById('topoSummary').value = state.topology.summary || '';
        document.getElementById('topoMermaid').value = state.topology.mermaid || '';
        document.getElementById('ledgerText').textContent = state.topology.parse_ledger_text || '';
        document.getElementById('ipDigestText').textContent = state.topology.ip_digest_text || '';
      }
      // Draw topology canvas if data is available
      if (state.topology && state.topology.tunnels) {
        try {
          window.TopoCanvas.draw(state.topology);
        } catch(e) {
          console.error('TopoCanvas draw failed:', e);
        }
      } else {
        // Clear canvas for USG scene or missing topology
        try { window.TopoCanvas.draw(null); } catch(e) {}
      }
      switchResultTab('nat');
    });

    // Export CSV
    document.getElementById('btnExport').addEventListener('click', function() {
      if (!state.rows || !state.rows.length) {
        alert('暂无数据可导出。');
        return;
      }
      var headers = ['Rule', '源IP/网段', '出口接口', '出口备注', '假IP', '真IP'];
      var csvLines = [headers.join(',')];
      for (var k = 0; k < state.rows.length; k++) {
        var row = state.rows[k];
        csvLines.push([
          '"' + (row.rule || '').replace(/"/g, '""') + '"',
          '"' + (row.source_ip || '').replace(/"/g, '""') + '"',
          '"' + (row.egress_name || '').replace(/"/g, '""') + '"',
          '"' + (row.egress_remark || '').replace(/"/g, '""') + '"',
          '"' + (row.fake_ip || '').replace(/"/g, '""') + '"',
          '"' + (row.real_ip || '').replace(/"/g, '""') + '"'
        ].join(','));
      }
      var blob = new Blob(['﻿' + csvLines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'er_config_analysis.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // Clear button
    document.getElementById('btnClear').addEventListener('click', function() {
      document.getElementById('configText').value = '';
      document.getElementById('mappingText').value = '';
      state.rows = [];
      state.topology = null;
      renderNATTable([]);
      document.getElementById('topoSummary').value = '';
      document.getElementById('topoMermaid').value = '';
      document.getElementById('ledgerText').textContent = '暂无数据。请解析 ER 配置以查看解析备注账本。';
      document.getElementById('ipDigestText').textContent = '暂无数据。请解析 ER 配置以查看 IP 摘要。';
    });

    // File import
    document.getElementById('configFile').addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        document.getElementById('configText').value = ev.target.result;
      };
      reader.readAsText(file);
    });

    // ── Zoom controls ──────────────────────────────────────────
    document.getElementById('zoomIn').addEventListener('click', function() {
      var z = window.TopoCanvas.getZoom();
      window.TopoCanvas.setZoom(Math.min(2.5, z * 1.2));
      window.TopoCanvas.updateZoomLabel();
      if (state.topology && state.topology.tunnels) window.TopoCanvas.draw(state.topology);
    });
    document.getElementById('zoomOut').addEventListener('click', function() {
      var z = window.TopoCanvas.getZoom();
      window.TopoCanvas.setZoom(Math.max(0.4, z * 0.8));
      window.TopoCanvas.updateZoomLabel();
      if (state.topology && state.topology.tunnels) window.TopoCanvas.draw(state.topology);
    });
    document.getElementById('zoomReset').addEventListener('click', function() {
      window.TopoCanvas.setZoom(1.0);
      window.TopoCanvas.setPanX(0);
      window.TopoCanvas.setPanY(0);
      window.TopoCanvas.updateZoomLabel();
      if (state.topology && state.topology.tunnels) window.TopoCanvas.draw(state.topology);
    });

    // ── Mouse wheel zoom ───────────────────────────────────────
    document.getElementById('topoContainer').addEventListener('wheel', function(e) {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        var z = window.TopoCanvas.getZoom();
        window.TopoCanvas.setZoom(Math.max(0.4, Math.min(2.5, z * (e.deltaY > 0 ? 0.9 : 1.1))));
        window.TopoCanvas.updateZoomLabel();
        if (state.topology && state.topology.tunnels) window.TopoCanvas.draw(state.topology);
      }
    }, { passive: false });

    // ── Mouse drag pan ─────────────────────────────────────────
    var topoContainer = document.getElementById('topoContainer');
    topoContainer.addEventListener('mousedown', function(e) {
      if (e.button !== 0) return; // Only left button
      window.TopoCanvas.startPan(e.clientX, e.clientY);
      topoContainer.style.cursor = 'grabbing';
      e.preventDefault();
    });
    document.addEventListener('mousemove', function(e) {
      window.TopoCanvas.movePan(e.clientX, e.clientY);
    });
    document.addEventListener('mouseup', function(e) {
      window.TopoCanvas.endPan();
      topoContainer.style.cursor = 'grab';
    });

    console.log('ER/USG Config Analyzer loaded. Parsing engine ready.');
  });
  </script>
</body>
</html>
