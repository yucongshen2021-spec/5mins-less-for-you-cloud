name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: all_in_one + portal + smoke (no browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask pytest psutil dnspython python-docx Pillow paramiko

      - name: Show test inventory
        working-directory: application/test
        env:
          TEST_MODE: "1"
          NO_BROWSER: "1"
        run: |
          python --version
          python -m pytest --collect-only -q --deselect all_in_one/test_e2e_playwright.py

      - name: Run pytest
        working-directory: application/test
        env:
          TEST_MODE: "1"
          NO_BROWSER: "1"
          PYTHONIOENCODING: utf-8
        run: |
          python -m pytest -q --deselect all_in_one/test_e2e_playwright.py
