name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: all_in_one + portal + smoke (no browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install tkinter + Xvfb (Ubuntu lacks display by default)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask pytest psutil dnspython python-docx Pillow paramiko

      - name: Start Xvfb (provides $DISPLAY for tkinter)
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for i in 1 2 3 4 5; do
            [ -e /tmp/.X99-lock ] && break
            sleep 1
          done

      - name: Show test inventory
        working-directory: application/test
        env:
          TEST_MODE: "1"
          NO_BROWSER: "1"
        run: |
          python --version
          python -m pytest --collect-only -q --deselect all_in_one/test_e2e_playwright.py

      - name: Run pytest
        working-directory: application/test
        env:
          TEST_MODE: "1"
          NO_BROWSER: "1"
          PYTHONIOENCODING: utf-8
        run: |
          python -m pytest -q --deselect all_in_one/test_e2e_playwright.py
