name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: all_in_one backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install tkinter + Xvfb (Ubuntu lacks display by default)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask pytest

      - name: Show test inventory
        working-directory: application/test/all_in_one
        run: |
          python --version
          python -m pytest --collect-only -q --ignore=test_e2e_playwright.py

      - name: Run pytest under xvfb
        working-directory: application/test/all_in_one
        env:
          TEST_MODE: "1"
          NO_BROWSER: "1"
          PYTHONIOENCODING: utf-8
        run: |
          xvfb-run -a python -m pytest -q --ignore=test_e2e_playwright.py
