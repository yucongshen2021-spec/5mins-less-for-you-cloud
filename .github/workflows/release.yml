name: release

# 触发：推 v* tag（如 v1.0.0、v1.2.3-rc1）。
# 行为：调用 tools/build_release.py 打 zip，上传到对应 tag 的 GitHub Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "手动触发时使用的版本号（如 v0.1.0-test），不会创建 git tag"
        required: true
        default: "v0.0.0-manual"

permissions:
  contents: write   # softprops/action-gh-release 需要写 release

jobs:
  build:
    name: Build & publish release zip
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 让 build_release.py 的 git describe 能拿到完整 tag 信息

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip (with bundled runtime)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/build_release.py --version "${{ steps.ver.outputs.version }}"
          dir dist

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.zip
          fail_on_unmatched_files: true
