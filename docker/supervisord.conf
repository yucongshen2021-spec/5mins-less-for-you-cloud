[supervisord]
nodaemon=true
user=root
logfile=/app/application/portal/logs/supervisord.log
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1024x768x24
autorestart=true
priority=10
stdout_logfile=/app/application/portal/logs/xvfb.log
stderr_logfile=/app/application/portal/logs/xvfb.log

[program:portal]
command=python /app/application/portal/app.py
environment=RELEASE_MODE="1",DISPLAY=":99",BROWSER="echo",SUPERVISOR_MODE="1"
autorestart=true
priority=20
stdout_logfile=/app/application/portal/logs/portal.log
stderr_logfile=/app/application/portal/logs/portal.log

[program:all_in_one]
command=python "/app/application/all_in_one - cc/web/app.py" 7003
environment=DISPLAY=":99",BROWSER="echo"
autorestart=true
priority=30
stdout_logfile=/app/application/portal/logs/all_in_one.log
stderr_logfile=/app/application/portal/logs/all_in_one.log

[program:test_report]
command=python "/app/application/自动做测试报告 - cc/app.py" 7002
environment=DISPLAY=":99",BROWSER="echo"
autorestart=true
priority=30
stdout_logfile=/app/application/portal/logs/test_report.log
stderr_logfile=/app/application/portal/logs/test_report.log

[program:domain_capture]
command=python "/app/application/自动抓域名发2/app.py" 7001
environment=DISPLAY=":99",BROWSER="echo"
autorestart=true
priority=30
stdout_logfile=/app/application/portal/logs/domain_capture.log
stderr_logfile=/app/application/portal/logs/domain_capture.log

[program:config_analyzer]
command=python "/app/application/自动梳理配置 - cc/app.py" 7004
environment=DISPLAY=":99",BROWSER="echo"
autorestart=true
priority=30
stdout_logfile=/app/application/portal/logs/config_analyzer.log
stderr_logfile=/app/application/portal/logs/config_analyzer.log
