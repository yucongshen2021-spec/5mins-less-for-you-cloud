[supervisord]
nodaemon=true
user=root
logfile=/app/application/portal/logs/supervisord.log
pidfile=/tmp/supervisord.pid

[program:portal]
command=python /app/application/portal/app.py
environment=BROWSER="echo",SUPERVISOR_MODE="1"
autorestart=true
priority=20
stdout_logfile=/app/application/portal/logs/portal.log
stderr_logfile=/app/application/portal/logs/portal.log

[program:all_in_one]
; 多 worker 并发：gunicorn 启 8 个 worker 进程，每个独立加载业务模块
; （独立 stub 实例 + 独立 _EMBEDDED_NS），worker 间天然并发。
; tkinter 已被 tkinter_stub 替代，无需 DISPLAY/Xvfb，无线程安全约束。
; 不能用 --preload：模块状态不能跨 fork。每 worker 由 post_fork 各自初始化。
; worker 数可用 GUNICORN_WORKERS 环境变量覆盖。
command=/usr/local/bin/gunicorn -c "/app/application/all_in_one - cc/web/gunicorn_conf.py" wsgi:application
directory=/app/application/all_in_one - cc/web
environment=BROWSER="echo",GUNICORN_WORKERS="16"
autorestart=true
priority=20
stdout_logfile=/app/application/portal/logs/all_in_one.log
stderr_logfile=/app/application/portal/logs/all_in_one.log

