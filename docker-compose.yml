services:
  portal:
    build: .
    container_name: fivemins-portal
    ports:
      - "5000:5000"
      - "9000:9000"
    volumes:
      - portal-data:/app/application/all_in_one - cc/data
      - portal-logs:/app/application/portal/logs
    environment:
      - SUPERVISOR_MODE=1
      - DISPLAY=:99
      - BROWSER=echo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

volumes:
  portal-data:
  portal-logs:
